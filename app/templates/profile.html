<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>プロフィール - 社内問い合わせ管理システム</title>
    <link rel="stylesheet" href="/static/css/style.css?v=1">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="system-title">
            社内問い合わせ管理システム
        </div>

        <div class="header-right">
            <div class="notification-wrapper">

                <button type="button"
                        class="notification"
                        id="notification-button">
                    🔔

                    {% if unread_count > 0 %}
                        <span class="notification-count">
                            {{ unread_count }}
                        </span>
                    {% endif %}
                </button>


                <div class="notification-popup" id="notification-popup">

                    <div class="notification-popup-header">
                        <span>通知</span>
                    </div>


                    <div class="notification-popup-body">

                        {% for notification in notifications %}

                        <a href="/notifications/{{ notification.id }}"
                        class="notification-popup-item">

                            <div class="notification-popup-message">
                                {{ notification.message }}
                            </div>

                            <div class="notification-popup-date">
                                {{ notification.created_at.strftime('%Y/%m/%d') }}
                            </div>

                        </a>

                        {% else %}

                        <div class="notification-popup-empty">
                            通知はありません。
                        </div>

                        {% endfor %}

                    </div>


                    <div class="notification-popup-footer">
                        <a href="/notifications">
                            すべて見る
                        </a>
                    </div>

                </div>

            </div>
            <!-- ログインユーザー名を表示 -->
            <span>{{ name }}</span>
        </div>
    </header>


    <!-- 全体レイアウト -->
    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">
            <nav>
                <a href="/home">・ホーム</a>
                <a href="/inquiry/register">・問い合わせ登録</a>
                <a href="/inquiry/history">・問い合わせ履歴</a>
                <a href="/profile" class="active">・プロフィール</a>
            </nav>

            <form action="/logout" method="post" class="logout-form">
                <button type="submit">・ログアウト</button>
            </form>
        </aside>


        <!-- メインコンテンツ -->
        <main class="main-content history-page">

            <h2>プロフィール情報</h2>

            <!-- 縦型のテーブル構造（左：項目名 / 右：データ） -->
            <table class="table_design02">
                <tbody>
                    <tr>
                        <th>氏名</th>
                        <td>{{ name }}</td>
                    </tr>
                    <tr>
                        <th>ユーザーID</th>
                        <td>{{ username }}</td>
                    </tr>
                    <tr>
                        <th>パスワード</th>
                        <td>••••••••（セキュリティのため非表示）</td>
                    </tr>
                </tbody>
            </table>

        </main>

    </div>

    <script>
        const notificationButton =
            document.getElementById("notification-button");

        const notificationPopup =
            document.getElementById("notification-popup");


        notificationButton.addEventListener("click", function (event) {

            event.stopPropagation();

            notificationPopup.classList.toggle("show");

        });


        document.addEventListener("click", function (event) {

            if (!notificationPopup.contains(event.target) &&
                !notificationButton.contains(event.target)) {

                notificationPopup.classList.remove("show");

            }

        });
    </script>

</body>
</html>
