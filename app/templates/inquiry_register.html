<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ホーム - 問い合わせ登録</title>

    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="system-title">
            社内問い合わせ管理システム
        </div>

        <div class="header-right">
            <div class="notification-wrapper">

                <button type="button"
                        class="notification"
                        id="notification-button">
                    🔔

                    {% if unread_count > 0 %}
                        <span class="notification-count">
                            {{ unread_count }}
                        </span>
                    {% endif %}
                </button>

                <div class="notification-popup" id="notification-popup">

                    <div class="notification-popup-header">
                        <span>通知</span>
                    </div>

                    <div class="notification-popup-body">

                        {% for notification in notifications %}

                        <a href="/notifications/{{ notification.id }}"
                        class="notification-popup-item">

                            <div class="notification-popup-message">
                                {{ notification.message }}
                            </div>

                            <div class="notification-popup-date">
                                {{ notification.created_at.strftime('%Y/%m/%d') }}
                            </div>

                        </a>

                        {% else %}

                        <div class="notification-popup-empty">
                            通知はありません。
                        </div>

                        {% endfor %}

                    </div>

                    <div class="notification-popup-footer">
                        <a href="/notifications">
                            すべて見る
                        </a>
                    </div>

                </div>

            </div>
            <!-- ログインユーザー名を表示 -->
            <span>{{ name }}</span>
        </div>
    </header>


    <!-- 全体 -->
    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">

            <nav>
                <a href="/home">・ホーム</a>
                <a href="/inquiry/register">・問い合わせ登録</a>
                <a href="/inquiry/history">・問い合わせ履歴</a>
                <a href="/profile">・プロフィール</a>
            </nav>

            <form action="/logout" method="post" class="logout-form">
                <button type="submit">・ログアウト</button>
            </form>

        </aside>


        <!-- メイン -->
        <main class="main-content">

            <h2>問い合わせ登録</h2>

            <form action="/inquiry/register" method="post" enctype="multipart/form-data">
                               
                <div class="inline-group">
                    <label>カテゴリ</label>
                    <select name="category" required>
                        <option value="">選択してください</option>
                        <option value="PC・端末">PC・端末</option>
                        <option value="ネットワーク">ネットワーク</option>
                        <option value="アカウント">アカウント</option>
                        <option value="ソフトウェア">ソフトウェア</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <div class="inline-group">
                    <label>件名</label>
                    <input type="text" name="title" required>
                </div>

                <div class="inline-group">
                    <label>内容</label>
                    <textarea
                        name="content"
                        rows="6"
                        placeholder="問い合わせ内容を入力してください。"
                        required
                    ></textarea>
                </div>

                <div class="inline-group">
                    <label>優先度</label>
                    <label>
                        <input type="radio" name="priority" value="低">
                        低
                    </label>

                    <label>
                        <input type="radio" name="priority" value="中" checked>
                        中
                    </label>

                    <label>
                        <input type="radio" name="priority" value="高">
                        高
                    </label>
                </div>

                <div class="inline-group">
                    <label>添付ファイル</label>

                    <input
                        type="file"
                        name="attachment"
                        accept=".png,.jpg,.jpeg,.pdf,.xlsx,.docx"
                    >
                </div>

                <button type="submit">登録</button>
            </form>


        </main>

    </div>

    <script>
        const notificationButton =
            document.getElementById("notification-button");

        const notificationPopup =
            document.getElementById("notification-popup");

        notificationButton.addEventListener("click", function (event) {

            event.stopPropagation();

            notificationPopup.classList.toggle("show");

        });

        document.addEventListener("click", function (event) {

            if (!notificationPopup.contains(event.target) &&
                !notificationButton.contains(event.target)) {

                notificationPopup.classList.remove("show");

            }

        });
    </script>

</body>
</html>
