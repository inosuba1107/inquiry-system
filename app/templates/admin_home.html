<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>管理者ホーム - 社内問い合わせ管理システム</title>

    <link rel="stylesheet" href="/static/css/common.css?v=1">
    <link rel="stylesheet" href="/static/css/admin.css?v=2">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">

        <div class="system-title">
            社内問い合わせ管理システム
        </div>

        <div class="header-right">
            <span>管理者用</span>
        </div>

    </header>


    <!-- 全体レイアウト -->
    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">

            <nav>
                <a href="/admin/home">・ホーム</a>
                <a href="/admin/inquiry">・問い合わせ一覧</a>
                <a href="/admin/staff">・担当者変更</a>
            </nav>

            <form action="/logout" method="post" class="logout-form">
                <button type="submit">・ログアウト</button>
            </form>

        </aside>


        <!-- メインコンテンツ -->
        <main class="admin-main-content">

            <h2 class="admin-title">
                管理者ページ
            </h2>


            <!-- 期間選択 -->
            <div class="period-search">

                <form method="get" action="/admin/home">

                    <label for="period">
                        期間
                    </label>

                    <select id="period" name="period">
                        <option value="month">今月</option>
                        <option value="last_month">先月</option>
                        <option value="3_months">3ヶ月</option>
                        <option value="year">今年</option>
                    </select>

                    <button type="submit">
                        表示
                    </button>

                </form>

            </div>


            <!-- グラフ3つ -->
            <section class="admin-charts">

                <!-- 月別 -->
                <div class="admin-chart-box">
                    <h3>月別問い合わせ件数</h3>

                    <div class="chart-area">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>


               <!-- カテゴリ -->
                <div class="admin-chart-box">
                    <h3>カテゴリ別件数</h3>

                    <div class="pie-chart-area">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>


                <!-- ステータス -->
                <div class="admin-chart-box">
                    <h3>ステータス別件数</h3>

                    <div class="pie-chart-area">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>

            </section>


            <!-- 件数カード -->
            <section class="admin-summary-cards">

                <div class="admin-summary-card">

                    <p>未対応件数</p>

                    <div class="admin-number">
                        {{ pending_count }} <span>件</span>
                    </div>

                </div>


                <div class="admin-summary-card">

                    <p>今月の対応件数</p>

                    <div class="admin-number">
                        {{ response_count }} <span>件</span>
                    </div>

                </div>


                <div class="admin-summary-card">

                    <p>今月の完了件数</p>

                    <div class="admin-number">
                        {{ completed_count }} <span>件</span>
                    </div>

                </div>

            </section>

        </main>

    </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>

    const monthlyLabels = {{ monthly_labels | tojson }};
    const monthlyCounts = {{ monthly_counts | tojson }};

    new Chart(
        document.getElementById("monthlyChart"),
        {
            type: "bar",
            data: {
                labels: monthlyLabels,
                datasets: [{
                    label: "問い合わせ件数",
                    data: monthlyCounts
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        ticks: {
                            autoSkip: true,
                            maxTicksLimit: 6,
                            maxRotation: 0,
                            minRotation: 0
                        }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0
                        }
                    }
                }
            }
        }
    );

</script>
<script>

    const categoryData = {{ category_counts | tojson }};
    const statusData = {{ status_counts | tojson }};


    // カテゴリ別問い合わせ件数
    new Chart(
        document.getElementById("categoryChart"),
        {
            type: "pie",
            data: {
                labels: Object.keys(categoryData),
                datasets: [{
                    data: Object.values(categoryData)
                }]
            },
            options: {
                responsive: false,
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        }
    );


    // ステータス別問い合わせ件数
    new Chart(
        document.getElementById("statusChart"),
        {
            type: "pie",
            data: {
                labels: Object.keys(statusData),
                datasets: [{
                    data: Object.values(statusData)
                }]
            },
            options: {
                responsive: false,
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        }
    );

</script>

</body>

</html>
