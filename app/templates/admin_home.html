<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>管理者ホーム - 社内問い合わせ管理システム</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <!-- ヘッダー -->
    <header class="header">

        <div class="system-title">
            社内問い合わせ管理システム
        </div>

        <div class="header-right">
            <span>管理者用</span>
        </div>

    </header>


    <!-- 全体レイアウト -->
    <div class="layout">

        <!-- サイドバー -->
        <aside class="sidebar">

            <nav>
                <a href="/admin/home">・ホーム</a>
                <a href="/admin/inquiry">・問い合わせ一覧</a>
                <a href="/admin/staff">・担当者変更</a>
            </nav>

            <form action="/logout" method="post" class="logout-form">
                <button type="submit">・ログアウト</button>
            </form>

        </aside>


        <!-- メインコンテンツ -->
        <main class="admin-main-content">

            <h2 class="admin-title">
                管理者ページ
            </h2>


            <!-- 期間選択 -->
            <div class="period-search">

                <label for="period">
                    期間
                </label>

                <select id="period">
                    <option>今月</option>
                    <option>先月</option>
                    <option>3ヶ月</option>
                    <option>今年</option>
                </select>

                <button type="button">
                    表示
                </button>

            </div>


            <!-- グラフ3つ -->
            <section class="admin-charts">

                <!-- 月別 -->
                <div class="admin-chart-box">

                    <h3>月別問い合わせ件数</h3>

                    <div class="bar-chart">

                        <div class="bar" style="height: 45%;">
                            <span>5月</span>
                        </div>

                        <div class="bar" style="height: 65%;">
                            <span>6月</span>
                        </div>

                        <div class="bar" style="height: 90%;">
                            <span>7月</span>
                        </div>

                        <div class="bar" style="height: 75%;">
                            <span>8月</span>
                        </div>

                    </div>

                </div>


                <!-- カテゴリ -->
                <div class="admin-chart-box">

                    <h3>カテゴリ別件数</h3>

                    <div class="admin-pie-area">

                        <div class="admin-pie-chart"></div>

                        <div class="admin-legend">
                            <p>■ PC・端末</p>
                            <p>■ ネットワーク</p>
                            <p>■ アカウント</p>
                            <p>■ ソフトウェア</p>
                            <p>■ その他</p>
                        </div>

                    </div>

                </div>


                <!-- ステータス -->
                <div class="admin-chart-box">

                    <h3>ステータス別件数</h3>

                    <div class="status-chart">

                        <div class="status-pie"></div>

                        <div class="admin-legend">
                            <p>■ 未対応</p>
                            <p>■ 対応中</p>
                            <p>■ 対応済</p>
                        </div>

                    </div>

                </div>

            </section>


            <!-- 件数カード -->
            <section class="admin-summary-cards">

                <div class="admin-summary-card">

                    <p>未対応件数</p>

                    <div class="admin-number">
                        {{ pending_count }} <span>件</span>
                    </div>

                </div>


                <div class="admin-summary-card">

                    <p>今月の対応件数</p>

                    <div class="admin-number">
                        {{ response_count }} <span>件</span>
                    </div>

                </div>


                <div class="admin-summary-card">

                    <p>今月の完了件数</p>

                    <div class="admin-number">
                        {{ completed_count }} <span>件</span>
                    </div>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
