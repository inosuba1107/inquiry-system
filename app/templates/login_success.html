<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン成功</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>問い合わせ管理システム</h1>

    <h2>ログイン成功</h2>

    <p>{{ name }} さん、ログインしました。</p>

    <p>ユーザー名：{{ username }}</p>
    <p>権限：{{ role }}</p>

    <form action="/logout" method="post">
        <button type="submit">ログアウト</button>
    </form>


</body>
</html>
